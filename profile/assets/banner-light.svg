<svg xmlns="http://www.w3.org/2000/svg" width="880" height="208" viewBox="0 0 880 208" role="img"><style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Mono', 'DejaVu Sans Mono', Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .caps { letter-spacing: .1em; text-transform: uppercase; }

  @keyframes sheen  { from { transform: translateX(-120%); } to { transform: translateX(260%); } }
  @keyframes rise   { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes slide  { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
  @keyframes grow   { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes widen  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes draw   { from { stroke-dashoffset: 200; } to { stroke-dashoffset: 0; } }

  .sheen { animation: sheen 5.5s cubic-bezier(.45,0,.2,1) infinite; }
  .rise  { animation: rise .5s cubic-bezier(.16,1,.3,1) both; }
  .slide { animation: slide .42s cubic-bezier(.16,1,.3,1) both; }
  .bar   { transform-box: fill-box; transform-origin: 50% 100%;
           animation: grow .62s cubic-bezier(.16,1,.3,1) both; }
  .fill  { transform-box: fill-box; transform-origin: 0% 50%;
           animation: widen .8s cubic-bezier(.16,1,.3,1) both; }
  /* The hidden start state lives in the keyframes, never in the static rule.
     A renderer that ignores CSS animations then falls back to the FINISHED
     state — a drawn line, visible text — instead of an empty panel. */
  .spark { stroke-dasharray: 200;
           animation: draw 1.1s cubic-bezier(.16,1,.3,1) both; }

  @media (prefers-reduced-motion: reduce) {
    .sheen { animation: none; opacity: 0; }
    .rise, .slide, .bar, .fill, .spark { animation: none; opacity: 1; transform: none;
                                         stroke-dashoffset: 0; }
  }</style><defs><filter id="grain1" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter><radialGradient id="wash2" cx="14%" cy="0%" r="62%">
         <stop offset="0%" stop-color="#a67f3b" stop-opacity="0.05"/>
         <stop offset="100%" stop-color="#a67f3b" stop-opacity="0"/>
       </radialGradient><linearGradient id="metal3" x1="0" y1="0" x2="1" y2="0.25"><stop offset="0%" stop-color="#8d919b"/><stop offset="16.666666666666664%" stop-color="#3a3c44"/><stop offset="33.33333333333333%" stop-color="#1b1c21"/><stop offset="50%" stop-color="#4a4d56"/><stop offset="66.66666666666666%" stop-color="#22242a"/><stop offset="83.33333333333334%" stop-color="#5e626c"/><stop offset="100%" stop-color="#2c2e35"/></linearGradient><linearGradient id="sheengrad5" x1="0" y1="0" x2="1" y2="0">
       <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
       <stop offset="50%" stop-color="#ffffff" stop-opacity="0.42"/>
       <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
     </linearGradient><clipPath id="wordclip4"><text x="28" y="96" font-size="54" font-weight="800" letter-spacing="-0.025em" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">mottt-hub</text></clipPath></defs><rect width="880" height="208" rx="16" fill="#f3f3f5"/><rect width="880" height="208" rx="16" fill="url(#wash2)"/><rect width="880" height="208" rx="16" filter="url(#grain1)" opacity="0.035" style="mix-blend-mode:overlay"/><rect x=".5" y=".5" width="879" height="207" rx="15.5" fill="none" stroke="rgba(10,10,12,0.14)"/><path d="M16 1.5 H864" stroke="rgba(10,10,12,0.08000000000000002)" stroke-width="1" fill="none"/><g clip-path="url(#wordclip4)"><rect x="28" y="42" width="287.11584000000005" height="70.2" fill="url(#metal3)"/><rect class="sheen" x="28" y="42" width="143.55792000000002" height="70.2" fill="url(#sheengrad5)"/></g><rect x="28" y="40" width="2" height="12" rx="1" fill="#a67f3b"/><text x="40" y="50" font-size="9.5" font-weight="600" fill="#97989e" letter-spacing="0.11em">ОРГАНИЗАЦИЯ · GITHUB</text><text x="29" y="124" font-size="14.5" font-weight="400" fill="#717178">Self-hosted инструменты, боты и автоматизация — всё на своём железе</text><text x="852" y="50" font-size="9.5" font-weight="600" fill="#a67f3b" text-anchor="end" letter-spacing="0.11em">ЖИВЫЕ ДАННЫЕ</text><text x="852" y="68" font-size="11" font-weight="400" fill="#97989e" text-anchor="end" class="mono">обновлено только что</text><path d="M28 142 H852" stroke="rgba(10,10,12,0.07)" stroke-width="1"/><rect x="28" y="162" width="2" height="14" rx="1" fill="#a67f3b"/><text x="40" y="174" font-size="21" font-weight="700" fill="#1f1f25" class="mono rise" opacity="1">16</text><text x="40" y="192" font-size="9" font-weight="600" fill="#97989e" letter-spacing="0.11em">РЕПОЗИТОРИЕВ</text><rect x="234" y="162" width="2" height="14" rx="1" fill="rgba(166,127,59,0.45)"/><text x="246" y="174" font-size="21" font-weight="700" fill="#1f1f25" class="mono rise" opacity="1">9</text><text x="246" y="192" font-size="9" font-weight="600" fill="#97989e" letter-spacing="0.11em">АКТИВНЫ ЗА 30 ДНЕЙ</text><rect x="440" y="162" width="2" height="14" rx="1" fill="rgba(166,127,59,0.45)"/><text x="452" y="174" font-size="21" font-weight="700" fill="#1f1f25" class="mono rise" opacity="1">289</text><text x="452" y="192" font-size="9" font-weight="600" fill="#97989e" letter-spacing="0.11em">КОММИТОВ / 30 ДНЕЙ</text><rect x="646" y="162" width="2" height="14" rx="1" fill="rgba(166,127,59,0.45)"/><text x="658" y="174" font-size="21" font-weight="700" fill="#1f1f25" class="mono rise" opacity="1">10 часов назад</text><text x="658" y="192" font-size="9" font-weight="600" fill="#97989e" letter-spacing="0.11em">ПОСЛЕДНЯЯ АКТИВНОСТЬ</text></svg>
